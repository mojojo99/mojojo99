<title>AI Office HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen studio — live 3D office floor (left) + agent desk panel (right); stacks on phones. */
:root {
  --bg: #eef0ed;
  --surface: #ffffff;
  --surface-2: #f4f6f3;
  --fg: #19221e;
  --muted: #5b6862;
  --line: #d8ddd8;
  --accent: #1d6a5a;
  --accent-soft: #dcebe6;
  --accent-fg: #ffffff;
  --working: #b8740c;
  --working-soft: #fbefd9;
  --done: #2c7a4b;
  --danger: #b3261e;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 8px 24px rgba(20,30,25,.08);
  --font-display: "Sora", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --surface: #181e1b; --surface-2: #1f2723; --fg: #e5ebe8; --muted: #9aa7a1;
    --line: #2d3732; --accent: #63b9a4; --accent-soft: #1d3a33; --accent-fg: #0c1512;
    --working: #e3a446; --working-soft: #3a2c14; --done: #6cc28f; --danger: #f08a80;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --surface: #181e1b; --surface-2: #1f2723; --fg: #e5ebe8; --muted: #9aa7a1;
  --line: #2d3732; --accent: #63b9a4; --accent-soft: #1d3a33; --accent-fg: #0c1512;
  --working: #e3a446; --working-soft: #3a2c14; --done: #6cc28f; --danger: #f08a80;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  grid-template-rows: auto minmax(0, 1fr);
  gap: 12px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.topbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand span { color: var(--muted); font-size: 13px; }
.save-state { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.save-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--done); display: inline-block; }
.save-state.local i { background: var(--working); }

/* Stage */
.stage { position: relative; min-width: 0; min-height: 0; border-radius: 14px; overflow: hidden; background: #cfd6d2; box-shadow: var(--shadow); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 3px 9px 3px 7px; border-radius: 999px; border: 1px solid rgba(0,0,0,.08);
  background: rgba(255,255,255,.92); color: #19221e; font-size: 12px; font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.12); transform: translate(-50%, -100%);
  transition: background .2s;
}
.tag small { font-weight: 500; color: #5b6862; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; background: #9aa7a1; }
.tag.working .dot { background: #e39a1f; box-shadow: 0 0 0 3px rgba(227,154,31,.3); }
.tag.selected { background: #19221e; color: #fff; }
.tag.selected small { color: #c8d2cd; }
.hint {
  position: absolute; top: 12px; left: 12px; font-size: 12px; color: #19221e;
  background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: 8px; pointer-events: none;
}
.daybar {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.94); color: #19221e;
  box-shadow: 0 4px 18px rgba(0,0,0,.14);
}
.daybar .clock { font-family: var(--font-mono); font-size: 22px; font-variant-numeric: tabular-nums; min-width: 72px; }
.daybar .range { flex: 1 1 180px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.daybar input[type=range] { width: 100%; accent-color: #1d6a5a; }
.daybar .ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: #5b6862; }
.daybar select { border: 1px solid #d8ddd8; border-radius: 8px; padding: 6px 8px; background: #fff; color: #19221e; }
.play {
  display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 10px; cursor: pointer;
  padding: 9px 14px; background: #1d6a5a; color: #fff; font-weight: 600;
}
.play svg { width: 14px; height: 14px; fill: currentColor; }
.load-msg { position: absolute; inset: 0; display: grid; place-items: center; color: #19221e; font-size: 14px; text-align: center; padding: 24px; }

/* Panel */
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.panel-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 13px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 600; flex: none; }
.avatar.lg { width: 52px; height: 52px; font-size: 18px; }
.who { min-width: 0; }
.who h2 { font-size: 18px; }
.who p { margin: 0; color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.working { background: var(--working-soft); color: var(--working); }
.pill.real { background: var(--accent-soft); color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { flex: 1; border: 0; background: none; padding: 7px 8px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.section { display: flex; flex-direction: column; gap: 8px; }
.section h3 { font-size: 13px; font-weight: 600; font-family: var(--font-body); letter-spacing: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
p { margin: 0; }
ul.plain { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
ul.ticks li { padding-left: 18px; position: relative; }
ul.ticks li::before { content: ""; position: absolute; left: 3px; top: .55em; width: 6px; height: 6px; border-radius: 2px; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); }
.times { display: flex; flex-wrap: wrap; gap: 6px; }
.time { font-family: var(--font-mono); font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.time.past { color: var(--muted); text-decoration: line-through; }
.time.next { border-color: var(--accent); color: var(--accent); }

.roster { display: flex; flex-direction: column; gap: 2px; }
.roster button {
  display: grid; grid-template-columns: 36px minmax(0,1fr) auto; align-items: center; gap: 10px; text-align: left;
  border: 0; background: none; padding: 8px; border-radius: 10px; cursor: pointer;
}
.roster button:hover { background: var(--surface-2); }
.roster .avatar { width: 36px; height: 36px; font-size: 13px; }
.roster strong { display: block; font-weight: 600; }
.roster span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster .when { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; }

.log { display: flex; flex-direction: column; gap: 0; }
.log-item { display: grid; grid-template-columns: 46px minmax(0,1fr); gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.log-item:first-child { border-top: 0; }
.log-item time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.log-item b { font-weight: 600; }
.sim { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 4px; }
.empty { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 13px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }

form.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
form.grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface-2);
}
.field textarea { resize: vertical; min-height: 64px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatches button[aria-pressed="true"] { border-color: var(--fg); }
.notice { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.confirm { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); }

/* Chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 4px; }
.msg.ai { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.composer { display: flex; gap: 8px; }
.composer textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--surface-2); resize: none; height: 44px; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest button { font-size: 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; }

/* Outline output */
.doc { border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: var(--surface-2); overflow-wrap: anywhere; min-width: 0; }
.doc h1 { font-size: 20px; margin: 0 0 8px; }
.doc h2 { font-size: 15px; margin: 18px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.doc h3 { font-size: 14px; margin: 12px 0 4px; font-family: var(--font-body); font-weight: 600; }
.doc h4 { font-size: 13px; margin: 10px 0 4px; font-family: var(--font-body); }
.doc p { margin: 6px 0; }
.doc ul, .doc ol { margin: 4px 0; padding-left: 20px; }
.doc li { margin: 2px 0; }
.doc ul ul { margin: 2px 0; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
.doc code { font-family: var(--font-mono); font-size: 12px; }
.doc .tbl { overflow-x: auto; }
.doc table { border-collapse: collapse; font-size: 12px; }
.doc td, .doc th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.library button.item { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 8px; border-radius: 8px; cursor: pointer; }
.library button.item:hover { background: var(--surface-2); }
.library .item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 20; }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0,1fr); grid-template-rows: auto; }
  .stage { height: 62vh; min-height: 380px; }
  .panel { overflow: visible; }
  .panel-body { overflow: visible; }
  .daybar .clock { font-size: 18px; min-width: 56px; }
  form.grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>AI Office HQ</h1>
      <span>Your team of AI agents for the daily routine</span>
    </div>
    <span class="save-state" id="save-state"><i></i><span>Loading your office…</span></span>
  </header>

  <section class="stage" id="stage" aria-label="3D office floor">
    <div class="load-msg" id="load-msg">Setting up the office…</div>
    <div class="labels" id="labels"></div>
    <div class="hint" id="hint">Drag to look around · scroll to zoom · click an agent</div>
    <div class="daybar">
      <button class="play" id="play" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span>Run my day</span></button>
      <div class="clock" id="clock" aria-live="polite">07:00</div>
      <div class="range">
        <input type="range" id="scrub" min="420" max="1140" step="5" value="420" aria-label="Time of day">
        <div class="ticks"><span>07:00</span><span>10:00</span><span>13:00</span><span>16:00</span><span>19:00</span></div>
      </div>
      <select id="speed" aria-label="Simulation speed">
        <option value="6">Slow</option>
        <option value="12" selected>Normal</option>
        <option value="30">Fast</option>
      </select>
    </div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
"use strict";

/* ---------------- Data ---------------- */
const DAY_START = 420, DAY_END = 1140, WORK_MIN = 25;
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const COLORS = ["#2f6db5", "#1d6a5a", "#b8562f", "#7a4fa3", "#c0901c", "#3b8f9e", "#a8325e", "#4f6b2f", "#5a5f6b"];
const SKINS = ["#f1c9a5", "#c68e63", "#8d5a3b", "#e8b48f", "#5c3a24", "#d9a07a"];
const HAIRS = ["#2a1c14", "#5b3a1e", "#111111", "#a0662f", "#3a2a22", "#d8c08a"];

const KINDS = {
  inbox: {
    label: "Inbox & email", tools: ["Gmail", "Outlook"],
    results: [
      "Triaged 47 new emails: 4 urgent, 11 need a reply, 32 archived.",
      "Drafted 6 replies for your review and flagged an invoice question from a client.",
      "Inbox down to 9 low-priority emails. Suggested 3 newsletters to unsubscribe from."
    ]
  },
  calendar: {
    label: "Calendar & meetings", tools: ["Google Calendar", "Zoom", "TwinMind"],
    results: [
      "Morning briefing: 4 meetings today, first at 09:30. Protected a 45-minute focus block at 14:00.",
      "Prepared the 10:00 client call: last meeting summary, open actions and 3 talking points.",
      "Meeting recap: captured 7 action items from today's calls and passed them to the task desk."
    ]
  },
  tasks: {
    label: "Tasks & to-dos", tools: ["Task list", "Gmail", "TwinMind"],
    results: [
      "Today's top 3: finish the client proposal, review the training deck, reply to the venue.",
      "Midday check: 5 of 9 tasks done. Moved 2 low-priority items to Thursday.",
      "End-of-day wrap: 8 tasks closed, 3 carried over, tomorrow's plan drafted."
    ]
  },
  research: {
    label: "Research & news", tools: ["Web search", "Google Drive"],
    results: [
      "Morning briefing: 5 stories on L&D trends, AI at work and your clients' industries.",
      "Deep-dive ready: a one-page summary on microlearning adoption in APAC companies."
    ]
  },
  training: {
    label: "Training outlines", tools: ["AI writing", "Google Drive"],
    results: [
      "Pipeline check: 2 client briefs are waiting. Open my desk to write their outlines.",
      "Reviewed this week's outline drafts. They're ready for your edits."
    ]
  },
  custom: { label: "Custom role", tools: [], results: [] }
};

const DEFAULT_AGENTS = [
  { id: "a-ava", name: "Ava", role: "Inbox Manager", kind: "inbox", color: COLORS[0], skin: SKINS[0], hair: HAIRS[0],
    description: "Keeps your inbox under control so only what matters reaches you.",
    responsibilities: ["Sort new email into urgent, reply and FYI", "Draft replies in your tone for review", "Flag client and invoice emails"],
    tools: ["Gmail", "Outlook"], times: ["07:30", "12:30", "17:00"] },
  { id: "a-marcus", name: "Marcus", role: "Calendar & Meetings Coordinator", kind: "calendar", color: COLORS[2], skin: SKINS[2], hair: HAIRS[2],
    description: "Plans your day around your meetings and makes sure you walk into each one prepared.",
    responsibilities: ["Morning schedule briefing", "Prep notes before client calls", "Meeting recaps with action items"],
    tools: ["Google Calendar", "Zoom", "TwinMind"], times: ["07:00", "09:15", "16:30"] },
  { id: "a-priya", name: "Priya", role: "Task Prioritiser", kind: "tasks", color: COLORS[3], skin: SKINS[1], hair: HAIRS[1],
    description: "Turns everything on your plate into a clear, ordered plan for the day.",
    responsibilities: ["Collect action items from email and meetings", "Pick today's top 3", "End-of-day wrap and tomorrow's plan"],
    tools: ["Task list", "Gmail", "TwinMind"], times: ["07:15", "13:00", "18:00"] },
  { id: "a-kenji", name: "Kenji", role: "Research Analyst", kind: "research", color: COLORS[5], skin: SKINS[3], hair: HAIRS[4],
    description: "Reads the news and research you don't have time for and boils it down.",
    responsibilities: ["Daily news briefing on your topics", "Background research on new clients", "One-page summaries on request"],
    tools: ["Web search", "Google Drive"], times: ["07:45", "15:00"] },
  { id: "a-leo", name: "Leo", role: "Training Designer", kind: "training", color: COLORS[1], skin: SKINS[5], hair: HAIRS[3],
    description: "Designs training outlines for your corporate clients: modules, objectives and timing.",
    responsibilities: ["Turn a client brief into a full training outline", "Write measurable learning objectives", "Plan module timing, activities and assessment"],
    tools: ["AI writing", "Google Drive"], times: ["10:00", "15:30"] }
];

const SLOTS = [[-9,-4],[-4,-4],[1,-4],[-9,1.2],[-4,1.2],[1,1.2],[-9,6.4],[-4,6.4],[1,6.4]];

let agents = [];
let selectedId = null;
let view = "overview";       // overview | agent | hire | edit
let tab = "profile";          // profile | chat | outline
let simMin = DAY_START;
let playing = false;
let fired = new Set();
const log = [];
const chats = {};
const runtime = {};
let outlineText = "", outlineBusy = false, outlineMeta = null, outlineCtrl = null;
let library = [];
let confirmRemove = false;

/* ---------------- Helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(t).trim()); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const fmt = m => { m = Math.round(m); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
const initials = n => String(n || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
const uid = () => "a-" + Math.random().toString(36).slice(2, 9);
const byId = id => agents.find(a => a.id === id);
function sortedTimes(a) { return (a.times || []).map(toMin).filter(v => v != null).sort((x, y) => x - y); }
function nextRun(a) { return sortedTimes(a).find(t => t >= simMin); }

/* ---------------- Markdown (small, safe) ---------------- */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
}
function md(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "", list = [], para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeLists = (depth = 0) => { while (list.length > depth) html += "</li></" + list.pop() + ">"; };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i], line = raw.trimEnd();
    if (!line.trim()) { flushPara(); continue; }
    let m;
    if (/^\s*\|.*\|\s*$/.test(line)) {
      flushPara(); closeLists();
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
      i--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let t = '<div class="tbl"><table>';
      rows.forEach((r, ri) => {
        if (/^\s*\|[\s:|-]+\|\s*$/.test(r)) return;
        const tag = ri === 0 ? "th" : "td";
        t += "<tr>" + cells(r).map(c => `<${tag}>${inline(c)}</${tag}>`).join("") + "</tr>";
      });
      html += t + "</table></div>"; continue;
    }
    if ((m = /^(#{1,4})\s+(.*)$/.exec(line))) { flushPara(); closeLists(); const n = m[1].length; html += `<h${n}>${inline(m[2])}</h${n}>`; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeLists(); html += "<hr>"; continue; }
    if ((m = /^(\s*)([-*•]|\d+[.)])\s+(.*)$/.exec(line))) {
      flushPara();
      const depth = Math.min(3, Math.floor(m[1].replace(/\t/g, "  ").length / 2) + 1);
      const type = /\d/.test(m[2]) ? "ol" : "ul";
      if (list.length < depth) { while (list.length < depth) { html += "<" + type + "><li>"; list.push(type); } html += inline(m[3]); }
      else { closeLists(depth); html += "</li><li>" + inline(m[3]); }
      continue;
    }
    if (list.length && /^\s{2,}\S/.test(raw)) { html += " " + inline(line.trim()); continue; }
    closeLists(); para.push(line.trim());
  }
  flushPara(); closeLists();
  return html;
}

function submitAgentForm(e) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const name = String(fd.get("name") || "").trim(), role = String(fd.get("role") || "").trim();
  const timesRaw = String(fd.get("times") || "").split(/[,\s]+/).filter(Boolean);
  const bad = timesRaw.filter(t => { const m = toMin(t); return m == null || m >= 1440; });
  const err = $("#form-error");
  if (!name || !role) { err.textContent = "Give the agent a name and a role."; return; }
  if (bad.length) { err.textContent = `These run times aren't valid: ${bad.join(", ")}. Use 24-hour times like 07:30.`; return; }
  const times = [...new Set(timesRaw.map(t => fmt(toMin(t))))].sort();
  const fields = {
    name, role,
    description: String(fd.get("description") || "").trim() || `${name} helps with ${role.toLowerCase()}.`,
    responsibilities: String(fd.get("responsibilities") || "").split("\n").map(s => s.trim()).filter(Boolean),
    tools: String(fd.get("tools") || "").split(",").map(s => s.trim()).filter(Boolean),
    times, color: formColor
  };
  if (view === "edit") {
    Object.assign(byId(selectedId), fields);
    view = "agent"; tab = "profile";
    toast(`${name} updated`);
  } else {
    const kind = String(fd.get("kind") || "custom");
    const a = { id: uid(), kind, skin: SKINS[agents.length % SKINS.length], hair: HAIRS[(agents.length + 2) % HAIRS.length], ...fields };
    agents.push(a); selectedId = a.id; view = "agent"; tab = "profile";
    toast(`${name} joined the office`);
  }
  save(); rebuildAgents(); renderPanel(); focusAgent(selectedId);
}

panel.addEventListener("click", e => {

  if (t.dataset.color) { formColor = t.dataset.color; panel.querySelectorAll("#swatches button").forEach(b => b.setAttribute("aria-pressed", b.dataset.color === formColor)); return; }
  if (t.dataset.lib) { const o = library.find(x => x.id === t.dataset.lib); if (o) { outlineText = o.text; outlineMeta = o; renderPanel(); } return; }
  switch (t.id) {
    case "back": if (view === "edit") { view = "agent"; } else { view = "overview"; selectedId = null; } confirmRemove = false; renderPanel(); syncSelection(); break;
    case "cancel": view = selectedId && byId(selectedId) && view === "edit" ? "agent" : "overview"; if (view === "overview") selectedId = null; renderPanel(); syncSelection(); break;

  const sc = document.createElement("canvas"); sc.width = 320; sc.height = 180;
  const st = new THREE.CanvasTexture(sc); st.encoding = THREE.sRGBEncoding;
  const screenM = new THREE.MeshBasicMaterial({ map: st, toneMapped: false });
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.04, 0.58), screenM); screen.position.set(0, 1.38, -0.395); g.add(screen);
  // Keyboard, mug, notebook
  box(0.55, 0.02, 0.18, mat("#d8d8d6"), 0, 0.79, 0.05, g);
  cyl(0.05, 0.045, 0.11, mat(a.color, { roughness: 0.4 }), 0.75, 0.835, -0.05, g, 14);
  box(0.3, 0.02, 0.4, mat("#30363a"), -0.75, 0.79, 0.05, g).rotation.y = 0.2;
  // Small desk plant
  cyl(0.07, 0.06, 0.12, mat("#ffffff"), -0.95, 0.84, -0.35, g, 12);
  const sp = new THREE.Mesh(new THREE.IcosahedronGeometry(0.11, 1), mat("#4d8a52")); sp.position.set(-0.95, 0.97, -0.35); g.add(sp);
  // Glow disk (status)
  const glowM = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.0, depthWrite: false });
  const glow = new THREE.Mesh(new THREE.CircleGeometry(1.0, 40), glowM); glow.rotation.x = -Math.PI / 2; glow.position.set(0, 0.015, 0.85); g.add(glow);

  // Chair + person (swivel group). Person faces -z (towards monitor).
  const chair = new THREE.Group(); chair.position.set(0, 0, 0.85); g.add(chair);
  const chairM = mat("#2f3538", { roughness: 0.85 });
  cyl(0.04, 0.04, 0.42, legM, 0, 0.24, 0, chair, 10);
  for (let i = 0; i < 5; i++) { const leg = box(0.34, 0.03, 0.05, legM, 0, 0.04, 0, chair); leg.rotation.y = i / 5 * Math.PI * 2; leg.translateX(0.17); }
  box(0.56, 0.08, 0.52, chairM, 0, 0.48, 0, chair);
  box(0.54, 0.62, 0.07, chairM, 0, 0.88, 0.27, chair);

  const skin = mat(a.skin || SKINS[0], { roughness: 0.6 });
  const shirt = mat(a.color, { roughness: 0.8 });
  const pants = mat("#2c3036", { roughness: 0.85 });
  const person = new THREE.Group(); chair.add(person);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.32, 6, 14), shirt); torso.position.set(0, 0.9, 0.06); torso.castShadow = true; person.add(torso);
  const head = new THREE.Group(); head.position.set(0, 1.33, 0.04); person.add(head);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 18), skin); skull.scale.set(1, 1.1, 1); skull.castShadow = true; head.add(skull);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.158, 24, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(a.hair || HAIRS[0], { roughness: 0.9 }));
  hair.position.set(0, 0.02, 0.012); hair.rotation.x = 0.25; head.add(hair);
  const neck = cyl(0.06, 0.06, 0.1, skin, 0, 1.2, 0.05, person, 10);
  for (const sx of [-0.1, 0.1]) {
    const thigh = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.34, 4, 10), pants); thigh.rotation.x = Math.PI / 2; thigh.position.set(sx, 0.6, -0.15); thigh.castShadow = true; person.add(thigh);
    const shin = new THREE.Mesh(new THREE.CapsuleGeometry(0.065, 0.36, 4, 10), pants); shin.position.set(sx, 0.32, -0.38); shin.castShadow = true; person.add(shin);
    box(0.11, 0.07, 0.22, mat("#1d1f22"), sx, 0.05, -0.45, person);
  }
  const arms = [];
  for (const sx of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(sx * 0.25, 1.1, 0.05); person.add(pivot);
    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.06, 0.26, 4, 10), shirt); upper.position.set(0, -0.16, 0); upper.castShadow = true; pivot.add(upper);
    const elbow = new THREE.Group(); elbow.position.set(0, -0.3, 0); pivot.add(elbow);
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.26, 4, 10), skin); fore.rotation.x = Math.PI / 2; fore.position.set(0, 0, -0.16); fore.castShadow = true; elbow.add(fore);
    pivot.rotation.x = 0.35; pivot.rotation.z = sx * 0.12; elbow.rotation.y = -sx * 0.25;
    arms.push(pivot);
  }

  const label = document.createElement("button");
  label.type = "button"; label.className = "tag"; label.addEventListener("click", () => selectAgent(a.id));
  labelsEl.appendChild(label);

  const rt = runtime[a.id] = { g, chair, head, arms, glow, screenCanvas: sc, screenTex: st, label, lastScreen: "", swivel: 0, phase: Math.random() * 6 };
  drawScreen(rt, a, false, 0);
  return rt;
}

function rebuildAgents() {
  if (!agentRoot) return;
  for (const id in runtime) { runtime[id].label.remove(); delete runtime[id]; }
  while (agentRoot.children.length) {
    const c = agentRoot.children.pop();
    c.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  }
  agents.forEach((a, i) => buildAgent(a, i));
  syncSelection();
}
function syncSelection() {
  for (const a of agents) { const rt = runtime[a.id]; if (rt) rt.label.classList.toggle("selected", a.id === selectedId && view !== "overview"); }
}

function focusAgent(id) {
  const rt = runtime[id]; if (!rt || !camera) return;
  const target = rt.g.position.clone().add(new THREE.Vector3(0, 0.9, 0.6));
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = Math.max(7, Math.min(11, camera.position.distanceTo(controls.target)));
  const toPos = target.clone().add(dir.multiplyScalar(dist));
  toPos.y = Math.max(toPos.y, 4.5);
  if (RM) { controls.target.copy(target); camera.position.copy(toPos); return; }
  camTween = { t: 0, fromT: controls.target.clone(), toT: target, fromP: camera.position.clone(), toP: toPos };
}

function drawWallScreen() {
  const key = Math.floor(simMin / 5) + "|" + agents.map(a => a.id + isWorking(a)).join();
  if (key === wallScreen.lastKey) return; wallScreen.lastKey = key;
  const g = wallScreen.canvas.getContext("2d"), w = 1024, h = 580;
  g.fillStyle = "#121a1f"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#6fc3ad"; g.font = "600 26px Inter, sans-serif"; g.fillText("TODAY'S RUN", 48, 66);
  g.fillStyle = "#f2f5f4"; g.font = "600 120px 'JetBrains Mono', monospace"; g.fillText(fmt(simMin), 44, 196);
  const working = agents.filter(isWorking);
  g.fillStyle = "#93a5a0"; g.font = "26px Inter, sans-serif";
  g.fillText(working.length ? "Working now: " + working.map(a => a.name).join(", ") : (playing ? "Team on standby" : "Press Run my day"), 48, 250);
  const up = agents.flatMap(a => sortedTimes(a).filter(t => t >= simMin).map(t => ({ a, t }))).sort((x, y) => x.t - y.t).slice(0, 5);
  g.font = "28px Inter, sans-serif";
  up.forEach((u, i) => {
    const y = 320 + i * 48;
    g.fillStyle = u.a.color; g.fillRect(48, y - 22, 10, 28);
    g.fillStyle = "#f2f5f4"; g.font = "28px 'JetBrains Mono', monospace"; g.fillText(fmt(u.t), 74, y);
    g.font = "28px Inter, sans-serif"; g.fillStyle = "#c9d4d0"; g.fillText(u.a.name + " · " + u.a.role, 200, y);
  });
  // progress bar
  const p = (simMin - DAY_START) / (DAY_END - DAY_START);
  g.fillStyle = "#26323a"; g.fillRect(48, h - 40, w - 96, 8); g.fillStyle = "#6fc3ad"; g.fillRect(48, h - 40, (w - 96) * p, 8);
  wallScreen.tex.needsUpdate = true;
}

const C_MORN = new THREE.Color("#ffd9b0"), C_NOON = new THREE.Color("#fff6ea"), C_EVE = new THREE.Color("#ff9d66");
const SKY_MORN = new THREE.Color("#ffe6cc"), SKY_NOON = new THREE.Color("#ffffff"), SKY_EVE = new THREE.Color("#ffb488");
function applyDaylight() {
  if (!sun) return;
  const p = (simMin - DAY_START) / (DAY_END - DAY_START); // 0..1
  const ang = -0.9 + p * 1.8;
  sun.position.set(Math.sin(ang) * 16, 8 + Math.cos(ang) * 8, -16);
  const c = p < 0.5 ? C_MORN.clone().lerp(C_NOON, p * 2) : C_NOON.clone().lerp(C_EVE, (p - 0.5) * 2);
  sun.color.copy(c); sun.intensity = 0.9 + Math.sin(p * Math.PI) * 0.8;
  hemi.intensity = 0.5 + Math.sin(p * Math.PI) * 0.25;
  skyMat.color.copy(p < 0.5 ? SKY_MORN.clone().lerp(SKY_NOON, p * 2) : SKY_NOON.clone().lerp(SKY_EVE, (p - 0.5) * 2));
}

/* ---------------- Simulation ---------------- */
function resultFor(a, idx) {
  const k = KINDS[a.kind] || KINDS.custom;
  if (k.results.length) return k.results[idx % k.results.length];
  const r = (a.responsibilities || [])[idx % Math.max(1, (a.responsibilities || []).length)];
  return r ? `Finished the scheduled run: ${r.charAt(0).toLowerCase() + r.slice(1)}.` : "Finished the scheduled run.";
}
function stepSim(prev, now) {
  let changed = false;
  for (const a of agents) {
    sortedTimes(a).forEach((t, idx) => {
      const key = a.id + "@" + t;
      if (!fired.has(key) && prev < t + 0.0001 && now >= t) { fired.add(key); changed = true; }
      const doneKey = key + "#done";
      if (fired.has(key) && !fired.has(doneKey) && now >= t + WORK_MIN) {
        fired.add(doneKey); changed = true;
        log.push({ t: t + WORK_MIN, name: a.name, text: resultFor(a, idx), sim: true });
      }
    });
  }
  return changed;
}
function setClock(m, fromScrub) {
  const prev = simMin; simMin = Math.max(DAY_START, Math.min(DAY_END, m));
  if (simMin < prev) {
    // Rewind: forget runs after the new time and their log lines.
    for (const k of [...fired]) { const t = +k.split("@")[1].split("#")[0]; if (t >= simMin || (k.endsWith("#done") && t + WORK_MIN > simMin)) fired.delete(k); }
    for (let i = log.length - 1; i >= 0; i--) if (log[i].sim && log[i].t > simMin) log.splice(i, 1);
    if (fromScrub) { for (const a of agents) sortedTimes(a).forEach(t => { if (t <= simMin && t + WORK_MIN > simMin) fired.add(a.id + "@" + t); }); }
  } else if (fromScrub) {
    stepSim(prev, simMin);
  }
  $("#clock").textContent = fmt(simMin);
  $("#scrub").value = String(Math.round(simMin));
  applyDaylight();
}
let panelDirty = false, lastPanelRefresh = 0;
function togglePlay(force) {
  playing = typeof force === "boolean" ? force : !playing;
  if (playing && simMin >= DAY_END) { setClock(DAY_START); }
  $("#play span").textContent = playing ? "Pause" : (simMin > DAY_START && simMin < DAY_END ? "Resume" : "Run my day");
  $("#play svg").innerHTML = playing ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>' : '<path d="M4 2.5v11l9-5.5z"/>';
}
$("#play").addEventListener("click", () => togglePlay());
$("#scrub").addEventListener("input", e => { setClock(+e.target.value, true); panelDirty = true; });

function tick(dt, t) {
  if (playing) {
    const prev = simMin;
    const next = Math.min(DAY_END, simMin + dt * (+$("#speed").value));
    simMin = next;
    if (stepSim(prev, next)) panelDirty = true;
    $("#clock").textContent = fmt(simMin); $("#scrub").value = String(Math.round(simMin));
    applyDaylight();
    if (simMin >= DAY_END) {
      togglePlay(false);
      log.push({ t: DAY_END, name: "Office", text: `Day complete. ${log.filter(l => l.sim).length} agent runs finished.`, sim: true });
      panelDirty = true;
    }
  }
  if (camTween) {
    camTween.t = Math.min(1, camTween.t + dt * 1.6);
    const e = 1 - Math.pow(1 - camTween.t, 3);
    controls.target.lerpVectors(camTween.fromT, camTween.toT, e);
    camera.position.lerpVectors(camTween.fromP, camTween.toP, e);
    if (camTween.t >= 1) camTween = null;
  }
  controls.update();

  const rect = stage.getBoundingClientRect();
  const v = new THREE.Vector3();
  for (const a of agents) {
    const rt = runtime[a.id]; if (!rt) continue;
    const working = isWorking(a);
    const selected = a.id === selectedId && view !== "overview";
    // Swivel to face the camera when selected and idle
    const target = selected && !working ? Math.PI : 0;
    rt.swivel += (target - rt.swivel) * Math.min(1, dt * (RM ? 30 : 4));
    rt.chair.rotation.y = rt.swivel;
    // Typing / idle motion
    if (!RM) {
      const s = working ? 14 : 1.2;
      rt.arms[0].rotation.x = 0.35 + (working ? Math.sin(t * s + rt.phase) * 0.06 : 0);
      rt.arms[1].rotation.x = 0.35 + (working ? Math.sin(t * s + rt.phase + 1.7) * 0.06 : 0);
      rt.head.rotation.x = working ? 0.08 + Math.sin(t * 2 + rt.phase) * 0.03 : Math.sin(t * 0.6 + rt.phase) * 0.04;
      rt.head.rotation.y = working ? 0 : Math.sin(t * 0.35 + rt.phase) * 0.25;
    }
    rt.glow.material.opacity += ((working ? 0.35 + (RM ? 0 : Math.sin(t * 4) * 0.1) : selected ? 0.22 : 0) - rt.glow.material.opacity) * Math.min(1, dt * 6);
    // Screen
    const tm = sortedTimes(a).find(x => simMin >= x && simMin < x + WORK_MIN);
    const prog = working && tm != null ? (simMin - tm) / WORK_MIN : 0;
    const sk = working ? "w" + Math.floor(prog * 20) : "i" + nextRun(a);
    if (sk !== rt.lastScreen) { rt.lastScreen = sk; drawScreen(rt, a, working, prog); }
    // Label
    v.set(0, 1.85, 0.85); rt.g.localToWorld(v); v.project(camera);
    const vis = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1;
    rt.label.hidden = !vis;
    if (vis) {
      rt.label.style.transform = `translate(${((v.x + 1) / 2 * rect.width).toFixed(1)}px, ${((1 - v.y) / 2 * rect.height).toFixed(1)}px) translate(-50%, -100%)`;
      const html = `<i class="dot"></i>${esc(a.name)} <small>${working ? "working" : esc(a.role.split(" ")[0])}</small>`;
      if (rt.label._html !== html) { rt.label.innerHTML = html; rt.label._html = html; rt.label.setAttribute("aria-label", `${a.name}, ${a.role}${working ? ", working" : ""}`); }
      rt.label.classList.toggle("working", working);
    }
  }
  drawWallScreen();
  renderer.render(scene, camera);

  // Refresh panel occasionally while time moves (not while the user is typing in a form)
  const now = performance.now();
  if (panelDirty && now - lastPanelRefresh > 400) {
    const typing = document.activeElement && panel.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    const safe = view === "overview" || (view === "agent" && tab === "profile");
    if (safe && !typing) { renderPanel(); }
    panelDirty = false; lastPanelRefresh = now;
  }
  if (playing && now - lastPanelRefresh > 1500 && view === "overview") panelDirty = true;
}

/* ---------------- Boot ---------------- */
(async function boot() {
  await loadState();
  renderPanel();
  if (typeof THREE === "undefined" || !THREE.OrbitControls) {
    const m = $("#load-msg"); if (m) m.textContent = "The 3D view couldn't load. Your agents still work in the panel.";
    return;
  }
  try { initScene(); }
  catch (e) { const m = $("#load-msg"); if (m) m.textContent = "Your device couldn't start the 3D view. Your agents still work in the panel."; }
})();
})();
</script>
